name: Flipx Winner Recorder

on:
  schedule:
    - cron: '*/10 * * * *' # Har 10 minute me automatic chalega
  workflow_dispatch:       # Manual "Run workflow" button ke liye

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f flipx_winners.csv ]; then
            git add flipx_winners.csv
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update flipx winners"
            git push
          else
            echo "No new rounds to commit."
          fi
